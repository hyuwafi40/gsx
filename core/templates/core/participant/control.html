<div class="card glass mb-20">
    <div class="ads-control">
        <form hx-get="{% url 'core:participant_list' %}"
              hx-target="#participantTableContainer"
              hx-swap="innerHTML"
              class="search-bar">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text"
                   name="q"
                   class="search-input"
                   placeholder="Cari participant..."
                   value="{{ query }}">
        </form>
        {% if user_role == "developer" or user_role == "administrator" %}
            <a href="{% url 'core:participant_create' %}" class="btn btn-primary">
                <i class="fa-solid fa-plus"></i> Tambah
            </a>
        {% endif %}
    </div>
</div>
