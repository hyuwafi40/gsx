{% if user_role == "developer" or user_role == "administrator" %}
    <select class="input-control"
            name="status"
            hx-post="{% url 'core:comment_update' comment.pk %}"
            hx-target="#comment-status-{{ comment.pk }}"
            hx-swap="outerHTML"
            hx-trigger="change">
        <option value="pending"
                {% if comment.status == 'pending' %}selected{% endif %}>Pending</option>
        <option value="approved"
                {% if comment.status == 'approved' %}selected{% endif %}>Approved</option>
    </select>
{% else %}
    <span class="status-badge {% if comment.status == 'approved' %}status-active{% else %}status-pending{% endif %}">
        {{ comment.get_status_display }}
    </span>
{% endif %}
