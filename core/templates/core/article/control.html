<div class="card glass mb-20">
    <div class="ads-control">
        <form hx-get="{% url 'core:article_list' %}"
              hx-target="#articleTableContainer"
              hx-swap="innerHTML"
              hx-trigger="keyup changed delay:300ms from:input"
              class="search-bar">
            <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
            <label class="sr-only" for="article-search">Cari artikel</label>
            <input id="article-search"
                   type="search"
                   name="q"
                   class="search-input"
                   placeholder="Cari artikel..."
                   value="{{ query }}">
        </form>
        {% if user_role == "developer" or user_role == "administrator" %}
            <a href="{% url 'core:article_create' %}" class="btn btn-primary">
                <i class="fa-solid fa-plus"></i> Tambah
            </a>
        {% endif %}
    </div>
</div>
