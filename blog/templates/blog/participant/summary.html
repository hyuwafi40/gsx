<div class="blog-participant-summary">
    <div class="blog-participant-stat">
        <i class="fa-solid fa-users"></i>
        <div>
            <span class="blog-participant-stat-value">{{ stats.total }}</span>
            <span class="blog-participant-stat-label">Total Peserta</span>
        </div>
    </div>
    <div class="blog-participant-stat">
        <i class="fa-solid fa-user-check"></i>
        <div>
            <span class="blog-participant-stat-value">{{ stats.verified }}</span>
            <span class="blog-participant-stat-label">Terverifikasi</span>
        </div>
    </div>
    <div class="blog-participant-stat">
        <i class="fa-solid fa-user-clock"></i>
        <div>
            <span class="blog-participant-stat-value">{{ stats.registered }}</span>
            <span class="blog-participant-stat-label">Terdaftar</span>
        </div>
    </div>
</div>
