<header class="blog-navbar">
    <div class="blog-navbar-inner">
        <a href="{% url 'blog:index' %}" class="blog-brand">
            {% if blog_brand_logo %}
                <img src="{{ blog_brand_logo }}"
                     alt="{{ blog_brand_name }}"
                     class="blog-brand-logo">
            {% else %}
                <i class="fa-solid fa-cube"></i>
            {% endif %}
            <span>{{ blog_brand_name|default:"ApexUI" }}</span>
        </a>
        <nav class="blog-nav-links" id="blogNavLinks" aria-label="Navigasi utama">
            {% for item in blog_nav_items %}
                <a href="{{ item.url }}"
                   class="blog-nav-link {% if item.active %}active{% endif %}"
                   {% if item.active %}aria-current="page"{% endif %}
                   {% if item.external %}target="_blank" rel="noopener noreferrer"{% endif %}>{{ item.label }}</a>
            {% endfor %}
            {% if blog_page_items %}
                <div class="blog-nav-dropdown {% if blog_pages_active %}active{% endif %}">
                    <button type="button"
                            class="blog-nav-link blog-nav-dropdown-toggle"
                            aria-expanded="false"
                            aria-controls="blogPagesMenu">
                        Halaman <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
                    </button>
                    <div class="blog-nav-dropdown-menu" id="blogPagesMenu">
                        {% for item in blog_page_items %}
                            <a href="{{ item.url }}"
                               class="blog-nav-link {% if item.active %}active{% endif %}"
                               {% if item.active %}aria-current="page"{% endif %}>{{ item.label }}</a>
                        {% endfor %}
                    </div>
                </div>
            {% endif %}
            <a href="{{ blog_registration_url }}"
               class="blog-nav-mobile-action blog-nav-link"
               target="_blank"
               rel="noopener noreferrer">Daftar</a>
        </nav>
        <div class="blog-nav-actions">
            <a href="{{ blog_registration_url }}"
               class="blog-btn"
               target="_blank"
               rel="noopener noreferrer">Daftar</a>
        </div>
        <button type="button"
                class="blog-nav-toggle"
                id="blogNavToggle"
                aria-label="Buka navigasi"
                aria-controls="blogNavLinks"
                aria-expanded="false">
            <i class="fa-solid fa-bars"></i>
        </button>
    </div>
</header>
