{% if ad %}
    <div class="blog-ad-slot blog-ad-slot--{{ ad.type_ads }}">
        <a href="{{ ad.link }}"
           target="_blank"
           rel="noopener noreferrer"
           class="blog-ad-link"
           aria-label="Buka iklan {{ ad.name }}">
            <img src="{{ ad.image }}"
                 alt="Iklan: {{ ad.name }}"
                 loading="lazy"
                 decoding="async">
        </a>
    </div>
{% endif %}
